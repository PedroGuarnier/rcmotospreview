name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rcmotos
          POSTGRES_PASSWORD: rcmotos
          POSTGRES_DB: rcmotos_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rcmotos" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Migrações aplicam do zero e batem com os modelos
        env:
          DATABASE_URL: postgresql+psycopg://rcmotos:rcmotos@localhost:5432/rcmotos_teste
        run: |
          uv run python -c "from app.db import Base, engine; from app import models; Base.metadata.drop_all(engine)"
          uv run alembic upgrade head
          uv run alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
